name: rimi_mobile
description: Rimi — Baby Shop & Rewards mobile app
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  go_router: ^14.6.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  intl: ^0.19.0
  google_fonts: ^6.2.1
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  # Fonts loaded via google_fonts (Quicksand + Plus Jakarta Sans)
